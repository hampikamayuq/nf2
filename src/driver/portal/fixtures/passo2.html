<!doctype html>
<!-- Fixture do Passo 2 (Serviço) espelhando o INVENTÁRIO REAL de 17/08/2026:
     selects nativos (no portal ficam atrás de select2), textarea de descrição,
     NBS + indicador da operação, e Avançar como submit SEM id. -->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Passo 2 — Serviço (fixture)</title>
  </head>
  <body>
    <h1>Emissão de NFS-e — Passo 2: Serviço</h1>
    <form onsubmit="return false">
      <p>
        Município de prestação
        <select id="LocalPrestacao_CodigoMunicipioPrestacao" name="LocalPrestacao.CodigoMunicipioPrestacao">
          <option value="">Selecione...</option>
          <option value="3304557">Rio de Janeiro/RJ</option>
          <option value="3550308">São Paulo/SP</option>
        </select>
      </p>
      <p>
        Código de Tributação Nacional
        <select id="ServicoPrestado_CodigoTributacaoNacional" name="ServicoPrestado.CodigoTributacaoNacional">
          <option value="">Selecione...</option>
          <option value="040101">04.01.01 - Medicina e biomedicina</option>
          <option value="010101">01.01.01 - Análise e desenvolvimento de sistemas</option>
        </select>
      </p>
      <p>
        Código de Tributação Complementar municipal
        <select id="ServicoPrestado_CodigoComplementarMunicipal" name="ServicoPrestado.CodigoComplementarMunicipal">
          <option value="">Selecione...</option>
          <option value="040101001">04.01.01.001 - Medicina e biomedicina</option>
          <option value="040101002">04.01.01.002 - Outra atividade</option>
        </select>
      </p>
      <p><label>Descrição do serviço <textarea id="ServicoPrestado_Descricao" name="ServicoPrestado.Descricao"></textarea></label></p>
      <p>
        Item NBS
        <select id="ServicoPrestado_CodigoNBS" name="ServicoPrestado.CodigoNBS">
          <option value=""></option>
          <option value="123012100">123012100 - Serviços de clínica médica</option>
          <option value="123012200">123012200 - Outro serviço de saúde</option>
        </select>
      </p>
      <p>
        Código indicador da operação
        <select id="ServicoPrestado_CodigoIndOp" name="ServicoPrestado.CodigoIndOp">
          <option value=""></option>
          <option value="030101">030101 - Prestação de serviços de saúde</option>
          <option value="030102">030102 - Outra operação</option>
        </select>
      </p>
      <button type="submit" onclick="location.href='passo3.html'">Avançar</button>
    </form>
  </body>
</html>
